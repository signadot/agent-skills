name: driver-plates@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial: driver plates get an SD- prefix"
  labels:
    feature: hotrod-plates@{suffix}
  forks:
  - forkOf:
      kind: Deployment
      namespace: hotrod
      name: driver
    customizations:
      images:
      - image: signadot/hotrod:f788b05bca80429425b814da62b2f17c3c564089-linux-amd64
        container: hotrod
  # The sandbox's preview link: a *.preview.signadot.com URL that opens the app with this sandbox's
  # routing key added to every request. `target` is where the link leads inside the cluster, not a
  # URL to open.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080
