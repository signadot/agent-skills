name: local-route@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial: route service running on this computer"
  # The sandbox's preview link: opens the app with this sandbox's routing key added to every request.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080
  local:
  - name: local-route
    from:
      kind: Deployment
      namespace: hotrod
      name: route
    mappings:
    - port: 8083
      toLocal: localhost:8083
