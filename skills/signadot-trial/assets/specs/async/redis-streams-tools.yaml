name: redis-streams-tools@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial: preview links to the producer's page (no sandbox is attached)"
  # Matches no sandbox, so requests through these links reach the baseline. Preview links open in any browser signed
  # in to the org, with no sudo connection, including on WSL, where cluster addresses never open in the browser.
  match:
    label:
      key: signadot-trial
      value: baseline-only
  endpoints:
  - name: producer
    target: http://producer.redis-streams-demo.svc:4000
