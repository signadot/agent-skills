name: rabbitmq-tools@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial: preview links to RabbitMQ's management UI (no sandbox is attached)"
  # Matches no sandbox, so requests through these links reach the baseline. Preview links open in any browser signed
  # in to the org, with no sudo connection, including on WSL, where cluster addresses never open in the browser.
  match:
    label:
      key: signadot-trial
      value: baseline-only
  endpoints:
  - name: rabbitmq-ui
    target: http://rabbitmq.rabbitmq-demo.svc:15672
