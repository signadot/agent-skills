name: temporal-worker@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (Temporal): a sandboxed worker on the shared money-transfer task queue"
  # The sandbox's preview link: opens the app with this sandbox's routing key added to every request.
  defaultRouteGroup:
    endpoints:
    - name: ui
      target: http://temporal-py-client-ui.temporal.svc:8080
  labels:
    demo: temporal
  forks:
  - forkOf:
      kind: Deployment
      namespace: temporal
      name: temporal-worker
    customizations:
      env:
      # Pick up routing changes quickly in the trial (the demo's default is 120 s).
      - name: ROUTES_API_REFRESH_INTERVAL_SECONDS
        value: "10"
