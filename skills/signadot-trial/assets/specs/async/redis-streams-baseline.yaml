name: redis-streams-baseline@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial: a link to the unchanged Redis Streams demo app (no sandbox is attached)"
  # Matches no sandbox, so requests through its link always reach the baseline.
  match:
    label:
      key: signadot-trial
      value: baseline-only
  endpoints:
  - name: ui
    target: http://producer.redis-streams-demo.svc:4000
