name: redis-streams-consumer@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (Redis Streams): consumer fork running processor v2"
  labels:
    demo: redis-streams
  forks:
  - forkOf:
      kind: Deployment
      namespace: redis-streams-demo
      name: consumer
    customizations:
      env:
      # The change under test: v2 uppercases message bodies.
      - name: PROCESSOR_VERSION
        value: v2
  # The sandbox's preview link. Signadot turns each endpoint into
  # https://<name>--<sandbox name>.preview.signadot.com, which forwards every request to `target`,
  # the service's address inside the cluster, with this sandbox's routing key added.
  defaultRouteGroup:
    endpoints:
    - name: ui
      target: http://producer.redis-streams-demo.svc:4000
