name: redis-streams-consumer@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (Redis Streams): consumer fork running processor v2"
  labels:
    demo: redis-streams
  forks:
  - forkOf:
      kind: Deployment
      namespace: redis-streams-demo
      name: consumer
    customizations:
      env:
      # The change under test: v2 uppercases message bodies.
      - name: PROCESSOR_VERSION
        value: v2
  # The sandbox's preview link: a *.preview.signadot.com URL that opens the app with this sandbox's
  # routing key added to every request. `target` is where the link leads inside the cluster, not a
  # URL to open.
  defaultRouteGroup:
    endpoints:
    - name: ui
      target: http://producer.redis-streams-demo.svc:4000
