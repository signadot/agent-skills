spec:
  selectionHint: "Run HotROD's existing Playwright suite (playwright-tests/ in signadot/hotrod) against a sandbox. Pass sandbox; optionally branch."
  cluster:
    fromSandbox: sandbox
  params:
  - name: sandbox
    required: true
  - name: branch
    default: main
  steps:
  - id: e2e
    action:
      actionID: "@{actionID}"
    routingContext:
      ref:
        sandboxRef: params.sandbox
    args:
      values:
        image: mcr.microsoft.com/playwright:v1.45.1-jammy
        timeout: 15m
        script: |
          set -e
          git clone --depth 1 -b "$(cat ./context/branch)" https://github.com/signadot/hotrod.git
          cd hotrod
          CYPRESS_INSTALL_BINARY=0 npm ci
          export HOTROD_NAMESPACE=hotrod CI=true
          echo "routing key: $SIGNADOT_ROUTING_KEY (sandbox $SIGNADOT_SANDBOX_NAME)"
          set +e
          npx playwright test playwright-tests/basic.spec.ts --reporter=list,html
          ec=$?
          tar czf "$OLDPWD/outputs/report" playwright-report
          exit $ec
      refs:
        branch: params.branch
    extraInputs:
    - name: branch
    extraOutputs:
    - name: report
      metadata:
        contentType: application/gzip
  output:
    exit_code: steps.e2e.outputs.exit_code
    report: steps.e2e.outputs.report
