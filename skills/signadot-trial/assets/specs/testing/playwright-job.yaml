spec:
  namePrefix: hotrod-playwright-e2e
  runnerGroup: hotrod-playwright@{suffix}
  script: |
    #!/bin/bash
    set -e
    # The same HotROD commit as the cluster, so the tests match the app they run against.
    git init -q hotrod && cd hotrod
    git fetch -q --depth 1 https://github.com/signadot/hotrod.git b16178651580a8ba3ceb45ac7c59f4579611b0b3
    git checkout -q FETCH_HEAD
    export HOTROD_NAMESPACE=hotrod CI=true
    CYPRESS_INSTALL_BINARY=0 npm ci
    set +e
    npm run e2e:playwright --spec playwright-tests/basic.spec.ts
    E2E_EXIT_CODE=$?
    set -e
    tar czf playwright-report.tar.gz playwright-report
    exit $E2E_EXIT_CODE
  routingContext:
    sandbox: "@{sandbox}"
  uploadArtifact:
    - path: hotrod/playwright-report/index.html
    - path: hotrod/playwright-report.tar.gz
