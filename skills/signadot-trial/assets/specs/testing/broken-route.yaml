name: broken-route@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (plans): route fork with a bad Redis address, a simulated regression"
  forks:
  - forkOf:
      kind: Deployment
      namespace: hotrod
      name: route
    customizations:
      env:
      - name: REDIS_ADDR
        value: redis-missing.hotrod:6379
  # The sandbox's preview link: a *.preview.signadot.com URL that opens the app with this sandbox's
  # routing key added to every request. `target` is where the link leads inside the cluster, not a
  # URL to open.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080
