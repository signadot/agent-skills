name: broken-route@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (plans): route fork with a bad Redis address, a simulated regression"
  # The sandbox's preview link: opens the app with this sandbox's routing key added to every request.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080
  forks:
  - forkOf:
      kind: Deployment
      namespace: hotrod
      name: route
    customizations:
      env:
      - name: REDIS_ADDR
        value: redis-missing.hotrod:6379
