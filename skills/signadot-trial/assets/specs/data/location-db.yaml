name: location-db@{suffix}
spec:
  cluster: "@{cluster}"
  description: "Signadot trial (database per sandbox): location service on its own database with different data"
  # The sandbox's preview link: opens the app with this sandbox's routing key added to every request.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080
  resources:
  - name: locationdb
    plugin: hotrod-trial-db@{suffix}
  forks:
  - forkOf:
      kind: Deployment
      namespace: hotrod
      name: location
    customizations:
      env:
      - name: MYSQL_DBNAME
        valueFrom:
          resource:
            name: locationdb
            outputKey: provision.dbname
