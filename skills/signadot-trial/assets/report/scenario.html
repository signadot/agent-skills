<section id="sandbox">
<h2><span class="step-n">3</span>The sandbox</h2>
<!-- FILL:sandbox
<p>The trial deployed the change as a sandbox with one CLI command. Signadot started a second route pod, with the
change, next to the normal one. Nothing else was copied.</p>
<dl class="facts">
<dt>Runs</dt><dd>a copy of route with <code>FAST_ROUTE=1</code>: pod <code>fast-route-dep-route-…</code></dd>
<dt>Shared</dt><dd>frontend, location, Kafka, driver, Redis, MySQL and the normal route</dd>
<dt>Routing key</dt><dd><code>7g2k9xq4m1ab</code>: requests that carry it reach the new route</dd>
<dt>Preview link</dt><dd><a href="https://frontend--fast-route.preview.signadot.com">https://frontend--fast-route.preview.signadot.com</a></dd>
<dt>Also created</dt><dd>nothing else</dd>
</dl>
<div class="cmd"><p>The sandbox spec:</p>
<pre><code>name: fast-route
spec:
  cluster: "signadot-trial"
  description: "Signadot trial: route returns every ETA as 1 second"
  # The change: a copy of HotROD's route Deployment, with one setting added. FAST_ROUTE makes route
  # return every ETA as 1 second instead of minutes. Every other service stays shared.
  forks:
  - forkOf:
      kind: Deployment
      namespace: hotrod
      name: route
    customizations:
      env:
      - name: FAST_ROUTE
        value: "1"
  # The sandbox's preview link. Signadot turns each endpoint into
  # https://&lt;name&gt;--&lt;sandbox name&gt;.preview.signadot.com, which forwards every request to `target`,
  # the service's address inside the cluster, with this sandbox's routing key added.
  defaultRouteGroup:
    endpoints:
    - name: frontend
      target: http://frontend.hotrod.svc:8080</code></pre></div>
<ul class="plain parts">
<li><code>forks</code>: what to copy (the route Deployment) and what's different in the copy.</li>
<li><code>defaultRouteGroup</code>: the preview link. It's the same app as <code>target</code>, reached through
Signadot, which adds the routing key:</li>
</ul>
<p class="linkmap"><code>https://frontend--fast-route.preview.signadot.com</code><span class="arrow">→</span>
<span>Signadot adds the routing key</span><span class="arrow">→</span><code>http://frontend.hotrod.svc:8080</code></p>
<div class="cmd"><p>Create it (safe to run again):</p>
<pre><code>/Users/me/project/.signadot-trial/bin/sd sandbox apply -f /Users/me/project/.agents/skills/signadot-trial/assets/specs/core/fast-route.yaml --set cluster=signadot-trial --set suffix=</code></pre></div>
<div class="cmd"><p>See its pod, <code>fast-route-dep-route-…</code>, next to the normal route pod:</p>
<pre><code>kubectl --kubeconfig /Users/me/project/.signadot-trial/kubeconfig -n hotrod get pods</code></pre></div>
<div class="cmd"><p>See the sandbox, its routing key and its link (also at
<a href="https://app.signadot.com/sandboxes">app.signadot.com/sandboxes</a>):</p>
<pre><code>/Users/me/project/.signadot-trial/bin/sd sandbox get fast-route</code></pre></div>
<p class="muted">Docs: <a href="https://www.signadot.com/docs/reference/sandboxes/spec">Sandbox spec</a>.</p>
