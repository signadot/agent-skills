<section id="how">
<h2>How Signadot handled it</h2>
<!-- FILL:how
<p>Signadot created a <strong>sandbox</strong>: one extra pod running the new driver, next to the shared, unchanged
app (the <strong>baseline</strong>). Nothing else was copied: the frontend, location and route services, Kafka, MySQL
and Redis were all the shared ones.</p>
<p>The sandbox has a <strong>routing key</strong>. A request carries it in a standard header
(<code>baggage: sd-routing-key=…</code>), and each service passes it along on its outgoing calls. When a request
reaches the driver service, Signadot's routing sends it to the sandbox if it carries the key, and to the baseline
otherwise.</p>
<div class="flows">
  <div class="flow"><span class="label">Without the key</span>
    <span class="hop">location<small>baseline</small></span><span class="arrow">→</span>
    <span class="hop">driver<small>baseline</small></span><span class="arrow">→</span>
    <span class="hop">route<small>baseline</small></span></div>
  <div class="flow"><span class="label">With the key</span>
    <span class="hop">location<small>baseline</small></span><span class="arrow">→</span>
