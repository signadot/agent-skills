<div class="cmd"><p>The sandbox spec:</p>
<pre><code>name: fast-route

  forks:

      namespace: hotrod

<section id="works">
<h2>What makes the routing work</h2>
<!-- FILL:works
<div class="works">
<div class="box"><h3><span class="step-n">1</span>The routing key is set where the request starts</h3>
<p>The sandbox link does it for you: Signadot adds <code>baggage: sd-routing-key=7g2k9xq4m1ab</code> to every
request made through it. The <a href="https://chromewebstore.google.com/detail/signadot/aigejiccjejdeiikegdjlofgcjhhnkim">Signadot
Chrome extension</a> does the same for any page you open, and any HTTP client can send the header itself.</p>
<p>To try that from your laptop, use Signadot's local connection: it makes every address inside the cluster, like
<code>http://frontend.hotrod.svc:8080</code>, reachable from your laptop. The trial connected without sudo, so
those names don't work in your terminal yet; the first step below fixes that.</p>
<div class="cmd"><p><strong>First, once:</strong> reconnect with sudo, so cluster addresses work in any terminal and
browser. It asks for your password. If your agent is still running scenarios, tell it you reconnected.</p>
<pre><code>/Users/me/project/.signadot-trial/bin/sd local disconnect && /Users/me/project/.signadot-trial/bin/sd local connect</code></pre></div>
<div class="cmd"><p>Check that it worked: this prints <code>200</code>. "Could not resolve host" means the reconnect
hasn't happened yet.</p>
<pre><code>curl -sS -o /dev/null -w '%{http_code}\n' http://frontend.hotrod.svc:8080/</code></pre></div>
<div class="cmd"><p>Book a ride with the routing key. It prints <code>{}</code> when the ride is booked:</p>
<pre><code>curl -sS -X POST http://frontend.hotrod.svc:8080/dispatch -H 'baggage: sd-routing-key=7g2k9xq4m1ab' -H 'Content-Type: application/json' -d '{"SessionID":4242,"RequestID":1,"PickupLocationID":1,"DropoffLocationID":123}'</code></pre></div>
<div class="cmd"><p>A few seconds later, read the ride's notifications. It prints a line like <code>Driver T738719C
arriving in 1s</code>; if it prints nothing, wait a moment and run it again:</p>
<pre><code>curl -sS 'http://frontend.hotrod.svc:8080/notifications?sessionID=4242&amp;cursor=0' | grep -o 'Driver [^"]*'</code></pre></div>
<p>Book again without the <code>baggage</code> header and with another <code>SessionID</code>, and the ETA is back
in minutes.
<a href="https://www.signadot.com/docs/guides/developer-environments/access-sandboxes">Ways to reach a sandbox</a></p></div>
<div class="box"><h3><span class="step-n">2</span>Each service passes the key along</h3>
<p>HotROD's services use OpenTelemetry, which carries the key in the <code>baggage</code> header from frontend into
the Kafka message, and from driver on to its call to route. Your services need the same; OpenTelemetry's
instrumentation does it in most languages, often with no code changes.
<a href="https://www.signadot.com/docs/guides/set-up-context-propagation">Passing the key along</a></p></div>
<div class="box"><h3><span class="step-n">3</span>Signadot routes by the key</h3>
<p>A small Signadot proxy, the sidecar, runs next to each HotROD service. When driver's call reaches the normal route
pod, its sidecar reads the key: with fast-route's key it forwards the call to the sandbox's route, and otherwise the
normal route answers. On Istio, Signadot configures the mesh to do this instead; on Linkerd, the sidecar runs next
to Linkerd's proxy. <a href="https://www.signadot.com/docs/guides/request-routing">Request routing</a></p>
<p>Messages work differently: a queue isn't routed. Every consumer reads the key on each message and handles only
the messages that are its own, as the Kafka scenario shows.</p></div>
</div>
